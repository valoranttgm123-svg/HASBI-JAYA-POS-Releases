name: Publish HASBI JAYA Desktop 1.3.3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-desktop-1.3.3.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-670c-8211-8c2b-c95b8e200c1c/raw?se=2026-09-14T12%3A29%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=c2192e3c-9743-5f65-866c-45126274493c&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T03%3A23%3A06Z&ske=2026-09-15T03%3A23%3A06Z&sks=b&skv=2026-02-06&sig=pIFwjN%2BejoRmahxL9oG3M83iN97Q48lZdh8S4Z61MCw%3D'
      DESKTOP_SHA256: '218336a90253272226fb7c1e435fdcbb1e26a38b467243d96573f37ad3707076'
      DESKTOP_SIZE: '182639842'
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors "$ARTIFACT_URL" -o desktop.zip
          mkdir -p stage
          unzip -q desktop.zip -d stage
          EXE='stage/desktop/release/HASBI-JAYA-Setup-1.3.3.exe'
          test -f "$EXE"
          test "$(stat -c%s "$EXE")" = "$DESKTOP_SIZE"
          test "$(sha256sum "$EXE" | awk '{print $1}')" = "$DESKTOP_SHA256"
      - name: Publish Desktop v1.3.3 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXE='stage/desktop/release/HASBI-JAYA-Setup-1.3.3.exe'
          NOTES='Hotfix Desktop: popup Login Admin dan modal umum sekarang selalu berada tepat di tengah viewport menggunakan React Portal, termasuk saat header memakai backdrop blur atau jendela di-resize. Tidak mengubah transaksi, stok, printing, maupun sinkronisasi Supabase.'
          gh release view desktop-v1.3.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create desktop-v1.3.3 --repo "$GITHUB_REPOSITORY" --title 'HASBI JAYA POS Desktop v1.3.3' --notes "$NOTES"
          gh release upload desktop-v1.3.3 "$EXE#HASBI-JAYA-Setup-1.3.3.exe" --repo "$GITHUB_REPOSITORY" --clobber
          printf '%s  %s\n' "$DESKTOP_SHA256" 'HASBI-JAYA-Setup-1.3.3.exe' > stage/SHA256SUMS.txt
          gh release upload desktop-v1.3.3 stage/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Activate desktop-latest.json
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-v1.3.3/HASBI-JAYA-Setup-1.3.3.exe"
          jq -n --arg download_url "$URL" --arg sha256 "$DESKTOP_SHA256" --argjson file_size "$DESKTOP_SIZE" '{version_name:"1.3.3",version_code:1003003,min_supported_version_code:1003001,download_url:$download_url,sha256:$sha256,file_size:$file_size,force_update:false,release_notes:"Hotfix: popup Login Admin dan modal umum sekarang selalu tepat di tengah viewport. Perbaikan posisi modal tidak mengubah transaksi, stok, printing, atau sinkronisasi."}' > desktop-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-latest.json
          git diff --cached --quiet || git commit -m 'release: activate Desktop 1.3.3'
          git push
      - name: Verify public release digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DJ=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/desktop-v1.3.3)
          echo "$DJ" | jq -e --arg d "sha256:$DESKTOP_SHA256" '.draft==false and .prerelease==false and any(.assets[]; .name=="HASBI-JAYA-Setup-1.3.3.exe" and .digest==$d)' >/dev/null
          test "$(jq -r '.version_name' desktop-latest.json)" = '1.3.3'
