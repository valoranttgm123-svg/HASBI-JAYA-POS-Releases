name: Publish Correct HASBI JAYA UI Patch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-correct-ui-patch.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOBILE_ARTIFACT_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-0464-81f8-bc20-523dec1b285a/raw?se=2026-09-14T10%3A47%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=8c26a2ee-8a4a-529e-8c2a-0fd78baa6552&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T01%3A07%3A38Z&ske=2026-09-15T01%3A07%3A38Z&sks=b&skv=2026-02-06&sig=8WfFQtAN3kth0yxAMLLcmJKPyCr9ktNyz0Ba0adEE3Y%3D'
      DESKTOP_ARTIFACT_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-1640-81f8-bcf2-fa61a4212940/raw?se=2026-09-14T10%3A48%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=896c9b69-1322-5bd2-80ef-0e19535678b0&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T00%3A19%3A32Z&ske=2026-09-15T00%3A19%3A32Z&sks=b&skv=2026-02-06&sig=L6PISTqsTzDk7/Y06keL5wXsS9W8A6zeyDcYFzFUry0%3D'
      MOBILE_SHA256: 'e9d554d8fa5afd0bf6367b5f99a39f5d991f3c1a59a4661b2b43efcb8c3caeb3'
      DESKTOP_SHA256: '7025416f87f82e31cf0f4c74b2b269725f7005d72272b463bc578b801970bc90'
      MOBILE_SIZE: '26551300'
      DESKTOP_SIZE: '182640008'
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors "$MOBILE_ARTIFACT_URL" -o mobile.zip
          curl --fail --location --retry 5 --retry-all-errors "$DESKTOP_ARTIFACT_URL" -o desktop.zip
          mkdir -p stage/mobile stage/desktop
          unzip -q mobile.zip -d stage/mobile
          unzip -q desktop.zip -d stage/desktop
      - name: Verify checksums and sizes
        shell: bash
        run: |
          set -euo pipefail
          MOBILE_APK='stage/mobile/HASBI-JAYA-POS-Mobile-v1.2.10+27-arm64.apk'
          DESKTOP_EXE='stage/desktop/desktop/release/HASBI-JAYA-Setup-1.3.2.exe'
          test -f "$MOBILE_APK" && test -f "$DESKTOP_EXE"
          test "$(stat -c%s "$MOBILE_APK")" = "$MOBILE_SIZE"
          test "$(stat -c%s "$DESKTOP_EXE")" = "$DESKTOP_SIZE"
          test "$(sha256sum "$MOBILE_APK" | awk '{print $1}')" = "$MOBILE_SHA256"
          test "$(sha256sum "$DESKTOP_EXE" | awk '{print $1}')" = "$DESKTOP_SHA256"
      - name: Publish GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MOBILE_APK='stage/mobile/HASBI-JAYA-POS-Mobile-v1.2.10+27-arm64.apk'
          DESKTOP_EXE='stage/desktop/desktop/release/HASBI-JAYA-Setup-1.3.2.exe'
          MOBILE_NOTES='Modernisasi UI Material 3 yang lebih bersih dan nyaman dibaca. Alur kasir, stok, barcode, laporan, offline queue, dan sinkronisasi Supabase tetap dipertahankan. Audit Flutter, test suite, serta data-plane produksi lulus.'
          DESKTOP_NOTES='Modernisasi workspace Desktop: sidebar, header, kartu, hirarki visual, dan tampilan responsif diperbarui tanpa mengubah logika transaksi atau sinkronisasi. Audit Update Center, cloud config, egress policy, auth read-only, perangkat POS, printing, dan dependency runtime lulus.'
          gh release view mobile-v1.2.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create mobile-v1.2.10 --repo "$GITHUB_REPOSITORY" --title 'HASBI JAYA POS Mobile v1.2.10' --notes "$MOBILE_NOTES"
          gh release upload mobile-v1.2.10 "$MOBILE_APK#HASBI-JAYA-POS-Mobile-v1.2.10+27-arm64.apk" --repo "$GITHUB_REPOSITORY" --clobber
          printf '%s  %s\n' "$MOBILE_SHA256" 'HASBI-JAYA-POS-Mobile-v1.2.10+27-arm64.apk' > stage/mobile/SHA256SUMS.txt
          gh release upload mobile-v1.2.10 stage/mobile/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release view desktop-v1.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create desktop-v1.3.2 --repo "$GITHUB_REPOSITORY" --title 'HASBI JAYA POS Desktop v1.3.2' --notes "$DESKTOP_NOTES"
          gh release upload desktop-v1.3.2 "$DESKTOP_EXE#HASBI-JAYA-Setup-1.3.2.exe" --repo "$GITHUB_REPOSITORY" --clobber
          printf '%s  %s\n' "$DESKTOP_SHA256" 'HASBI-JAYA-Setup-1.3.2.exe' > stage/desktop/SHA256SUMS.txt
          gh release upload desktop-v1.3.2 stage/desktop/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Write latest manifests
        shell: bash
        run: |
          set -euo pipefail
          MOBILE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/mobile-v1.2.10/HASBI-JAYA-POS-Mobile-v1.2.10%2B27-arm64.apk"
          DESKTOP_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-v1.3.2/HASBI-JAYA-Setup-1.3.2.exe"
          jq -n --arg download_url "$MOBILE_URL" --arg sha256 "$MOBILE_SHA256" --argjson file_size "$MOBILE_SIZE" '{version_name:"1.2.10",version_code:27,min_supported_version_code:26,download_url:$download_url,sha256:$sha256,file_size:$file_size,force_update:false,release_notes:"Modernisasi UI Material 3 yang lebih bersih dan nyaman digunakan tanpa mengubah alur bisnis inti."}' > mobile-latest.json
          jq -n --arg download_url "$DESKTOP_URL" --arg sha256 "$DESKTOP_SHA256" --argjson file_size "$DESKTOP_SIZE" '{version_name:"1.3.2",version_code:1003002,min_supported_version_code:1002009,download_url:$download_url,sha256:$sha256,file_size:$file_size,force_update:false,release_notes:"Modernisasi UI Desktop yang lebih rapi dan modern tanpa mengubah logika transaksi dan sinkronisasi inti."}' > desktop-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-latest.json desktop-latest.json
          git diff --cached --quiet || git commit -m 'release: activate Mobile 1.2.10 and Desktop 1.3.2'
          git push
      - name: Verify public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MJ=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/mobile-v1.2.10)
          DJ=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/desktop-v1.3.2)
          echo "$MJ" | jq -e --arg d "sha256:$MOBILE_SHA256" '.draft==false and .prerelease==false and any(.assets[]; .name=="HASBI-JAYA-POS-Mobile-v1.2.10+27-arm64.apk" and .digest==$d)' >/dev/null
          echo "$DJ" | jq -e --arg d "sha256:$DESKTOP_SHA256" '.draft==false and .prerelease==false and any(.assets[]; .name=="HASBI-JAYA-Setup-1.3.2.exe" and .digest==$d)' >/dev/null
