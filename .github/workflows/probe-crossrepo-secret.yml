name: Probe cross-repo release secret

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-crossrepo-secret.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured secret names
        shell: bash
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          PAT: ${{ secrets.PAT }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for key in RELEASE_REPO_TOKEN SOURCE_REPO_TOKEN GH_PAT GITHUB_PAT PAT REPO_TOKEN PERSONAL_ACCESS_TOKEN; do
            if [ -n "${!key:-}" ]; then
              echo "$key=SET"
            else
              echo "$key=EMPTY"
            fi
          done
